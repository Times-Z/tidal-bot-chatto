version: '3'

vars:
  TASK_BIN:
    sh: command -v go-task >/dev/null 2>&1 && echo "go-task" || echo "task"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - "{{.TASK_BIN}} --list"

  ci:
    desc: Run continuous integration tasks
    cmds:
      - task: fmt
      - task: test
      - task: build

  build:
    desc: Build chatto-bot-tidal binary (release)
    cmds:
      - cargo build --release -p chatto-bot-tidal

  fmt:
    desc: Format Rust sources
    cmds:
      - cargo fmt

  test:
    desc: Run all tests
    cmds:
      - cargo test

  dev:
    desc: Run the app in dev mode (auto-reload with cargo-watch if available)
    cmds:
      - |
        if command -v cargo-watch >/dev/null 2>&1 || cargo install --list 2>/dev/null | grep -q 'cargo-watch'; then
          cargo watch -x "run -p chatto-bot-tidal"
        else
          RUST_LOG=debug cargo run -p chatto-bot-tidal
        fi

  dev:once:
    desc: Run the app once in dev mode (no auto-reload)
    cmds:
      - RUST_LOG=debug cargo run -p chatto-bot-tidal
