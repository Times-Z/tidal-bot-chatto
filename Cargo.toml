[workspace]
members = [
    "crates/app",
    "crates/bot",
    "crates/chatto",
    "crates/config",
    "crates/livekit_audio",
    "crates/livekit_video",
    "crates/tidal",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
humantime = "2.2"
chrono = "0.4"
